name: build-practicestats
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build src/PracticeStats.csproj -c Release
      - name: Package
        run: |
          mkdir -p out/PracticeStats
          cp src/bin/Release/netstandard2.0/PracticeStats.dll out/PracticeStats/PracticeStats.dll
          cp Info.json out/PracticeStats/Info.json
          cd out/PracticeStats && zip -r ../PracticeStats_0.1.2v_UMM_ADOFAI_3.4.0.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: PracticeStats_0.1.2v_UMM_ADOFAI_3.4.0
          path: out/PracticeStats_0.1.2v_UMM_ADOFAI_3.4.0.zip
