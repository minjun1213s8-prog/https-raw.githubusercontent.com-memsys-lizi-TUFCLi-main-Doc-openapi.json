name: build-timinglimiter
on:
  push:
    branches: [ main ]
    paths:
      - 'timinglimiter/**'
      - 'build/**'
      - 'TimingLimiter.Info.json'
      - '.github/workflows/build-timinglimiter.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build timinglimiter/TimingLimiter.csproj -c Release
      - name: Package
        run: |
          mkdir -p out/TimingLimiter
          cp timinglimiter/bin/Release/netstandard2.0/TimingLimiter.dll out/TimingLimiter/TimingLimiter.dll
          HARMONY_DLL="$(find "$HOME/.nuget/packages/lib.harmony" -type f -path '*/net48/0Harmony.dll' | head -n 1)"
          if [ -z "$HARMONY_DLL" ]; then
            HARMONY_DLL="$(find "$HOME/.nuget/packages/lib.harmony" -type f -path '*/net472/0Harmony.dll' | head -n 1)"
          fi
          if [ -z "$HARMONY_DLL" ]; then
            HARMONY_DLL="$(find "$HOME/.nuget/packages/lib.harmony" -type f -path '*/netstandard2.0/0Harmony.dll' | head -n 1)"
          fi
          test -n "$HARMONY_DLL"
          echo "Using Harmony: $HARMONY_DLL"
          cp "$HARMONY_DLL" out/TimingLimiter/0Harmony.dll
          cp TimingLimiter.Info.json out/TimingLimiter/Info.json
          cd out/TimingLimiter && zip -r ../TimingLimiter_0.1.7_UMM_ADOFAI_Current.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: TimingLimiter_0.1.7_UMM_ADOFAI_Current
          path: out/TimingLimiter_0.1.7_UMM_ADOFAI_Current.zip
